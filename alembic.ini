# Alembic CLI config — run from the repo root, e.g.:
#     alembic history
#     alembic stamp 001_baseline      (one-time, against the existing prod DB)
#     alembic upgrade head
#     alembic upgrade head --sql      (print SQL without executing)
# The database URL comes from the DATABASE_URL env var (see
# migrations/env.py) — it is deliberately not stored here.
# At app startup, db.init_db() runs `upgrade head` programmatically and
# does NOT read this file (script_location is resolved in code).

[alembic]
script_location = src/nba_projection_bot/migrations
